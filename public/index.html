<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BreakFog · News Hub</title>
    <link rel="stylesheet" href="/styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,600;1,9..40,400&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="page">
      <header class="site-header">
        <div class="site-header__spacer" aria-hidden="true"></div>
        <nav class="channel-nav" aria-label="News categories">
          <button type="button" class="channel-pill is-active" data-channel="live">Live</button>
          <button type="button" class="channel-pill" data-channel="finance">Finance</button>
          <button type="button" class="channel-pill" data-channel="military">Military</button>
          <button type="button" class="channel-pill" data-channel="politics">Politics</button>
          <button type="button" class="channel-pill" data-channel="sports">Sports</button>
          <button type="button" class="channel-pill" data-channel="other">Other</button>
        </nav>
        <div class="header-meta">
          <span class="header-meta-label">Last updated</span>
          <time id="refreshed-at">—</time>
        </div>
      </header>

      <main id="board" class="board" aria-live="polite"></main>

      <footer class="foot">
        <p>
          Data from public RSS feeds for local demo only. Yahoo Finance via
          <a href="https://ca.finance.yahoo.com/" rel="noopener noreferrer" target="_blank">ca.finance.yahoo.com</a>.
          Click a headline to open the original article.
        </p>
      </footer>
    </div>

    <button type="button" class="fab" id="fab" aria-label="Refresh feed" title="Refresh">
      <span class="fab-icon fab-icon--refresh" aria-hidden="true">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
          <path d="M3 3v5h5" />
          <path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16" />
          <path d="M16 16h5v5" />
        </svg>
      </span>
      <span class="fab-icon fab-icon--top" hidden aria-hidden="true">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 19V5M5 12l7-7 7 7" />
        </svg>
      </span>
    </button>

    <script src="/app.js" type="module"></script>
  </body>
</html>
